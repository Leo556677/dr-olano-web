name: Replace landing images

on:
  push:
    paths:
      - '.image-upload-ready'

permissions:
  contents: write

jobs:
  replace-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild optimized landing images
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .image-upload/hero-doctor-640.webp.b64 > assets/hero-doctor-640.webp
          base64 -d .image-upload/unidad-estetica-640.webp.b64 > assets/unidad-estetica-640.webp
          base64 -d .image-upload/unidad-dolor-640.webp.b64 > assets/unidad-dolor-640.webp
          cat .image-upload/promo-mes-640.webp.b64.part* | base64 -d > assets/promo-mes-640.webp
          cat .image-upload/unidad-metabolismo-640.webp.b64.part* | base64 -d > assets/unidad-metabolismo-640.webp
          file assets/hero-doctor-640.webp assets/unidad-estetica-640.webp assets/unidad-dolor-640.webp assets/promo-mes-640.webp assets/unidad-metabolismo-640.webp
      - name: Commit landing image replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .image-upload .image-upload-ready .image-upload-note
          git add -A
          git commit -m "Replace landing images with Dr. Olano branding"
          git push
