name: Dr Olano DNI y correo - pruebas aisladas

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/booking-email-confirm-v1.js'
      - 'assets/booking-email-otp-v1.js'
      - '_includes/v28/**'
      - 'integrations/email/**'
      - 'integrations/supabase/crm/**'
      - 'tests/booking-email-confirm.test.mjs'
      - 'tests/email-confirm-crm-*.sql'
      - '.github/workflows/booking-dni-email.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email-ui:
    name: Modal, OTP, seguridad y plantilla HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/booking-email-confirm.test.mjs
      - run: node --test tests/booking-email-otp.test.mjs

  crm-dni:
    name: Transacción DNI y correo en PostgreSQL aislado
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: only_for_ephemeral_ci
          POSTGRES_DB: olano_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d olano_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: olano_test
      PGPASSWORD: only_for_ephemeral_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: psql -X -v ON_ERROR_STOP=1 -f tests/otp-crm-fixture.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f integrations/supabase/crm/migrations/20261110170000_email_otp_booking_bridge.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f tests/email-confirm-crm-fixture.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f integrations/supabase/crm/migrations/20261110192000_reserva_dni_privado.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f tests/email-confirm-crm-integration.sql
