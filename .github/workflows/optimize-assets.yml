name: Optimize Olano Medic media

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate optimized non-landing assets
        run: |
          set -euxo pipefail
          # The five landing WebP images are canonical production assets and must not
          # be regenerated from the legacy JPG files, otherwise the Dr. Olano branding
          # replacement would be overwritten.
          ffmpeg -y -i assets/logo-isotipo.png -vf "scale=128:128:force_original_aspect_ratio=decrease,pad=128:128:(ow-iw)/2:(oh-ih)/2:color=0x00000000" assets/logo-isotipo-128.png
          ffmpeg -y -i assets/intro-olano.mp4 -vf "scale=720:-2" -c:v libx264 -preset slow -crf 27 -movflags +faststart -c:a aac -b:a 64k assets/intro-olano-720.mp4

      - name: Commit optimized media only when changed
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo-isotipo-128.png assets/intro-olano-720.mp4
          if git diff --cached --quiet; then
            echo "Optimized assets are already current."
          else
            git commit -m "Optimize Olano Medic media assets"
            git push origin HEAD:main
          fi
