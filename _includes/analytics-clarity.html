<!-- Microsoft Clarity: grabaciones de sesión y mapas de calor.
     Se activa al poner el ID del proyecto en CLARITY_ID. Nombre, celular, resumen y código de la cita quedan ocultos. -->
<script>
(function(w,d){
  var CLARITY_ID="";
  if(!CLARITY_ID)return;
  var MASK='#clientName,#clientPhone,.field,#summary,#bookingCode,.done,#novareNoteBox,.jpago';
  function mask(){try{d.querySelectorAll(MASK).forEach(function(el){el.setAttribute("data-clarity-mask","true")})}catch(e){}}
  (function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y)})(w,d,"clarity","script",CLARITY_ID);
  if(d.readyState==="loading")d.addEventListener("DOMContentLoaded",mask);else mask();
  // La reserva agrega bloques después de cargar: se vuelven a ocultar.
  var pend=false;
  if("MutationObserver" in w)new MutationObserver(function(){if(pend)return;pend=true;setTimeout(function(){pend=false;mask()},250)}).observe(d.documentElement,{childList:true,subtree:true});
})(window,document);
</script>
